<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N5 Dokkai - 10 Teks Bacaan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Indonesian:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #e74c3c;
            --secondary: #2c3e50;
            --accent: #f39c12;
            --bg: #f5f5f0;
            --card: #ffffff;
            --text: #2c3e50;
            --highlight: #fff3cd;
            --active-highlight: #ffeb3b;
        }
        
        body {
            font-family: 'Noto Sans Indonesian', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(231, 76, 60, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(243, 156, 18, 0.05) 0%, transparent 20%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* Fixed Header */
        header {
            background: linear-gradient(135deg, var(--secondary) 0%, #34495e 100%);
            color: white;
            padding: 1.5rem;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,0.03) 35px, rgba(255,255,255,0.03) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255,255,255,0.03) 35px, rgba(255,255,255,0.03) 70px);
            pointer-events: none;
        }
        
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            position: relative;
            z-index: 1;
        }
        
        header p {
            font-size: 0.9rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        /* Navigation Dots */
        .nav-dots {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 999;
            background: rgba(255,255,255,0.9);
            padding: 15px 10px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #bdc3c7;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .nav-dot:hover {
            background: var(--primary);
            transform: scale(1.2);
        }
        
        .nav-dot.active {
            background: var(--primary);
            border-color: var(--secondary);
            transform: scale(1.3);
        }
        
        /* Main Content */
        .main-content {
            margin-top: 100px;
            padding: 2rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Reading Card */
        .reading-card {
            background: var(--card);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            scroll-margin-top: 120px;
        }
        
        .reading-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
        }
        
        .text-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .text-title {
            font-size: 1.5rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .text-number {
            background: var(--primary);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        /* Audio Controls */
        .audio-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .btn-play {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        
        .btn-play:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        
        .btn-play.playing {
            background: #27ae60;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
        }
        
        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #ecf0f1;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }
        
        .speed-control label {
            font-size: 0.85rem;
            color: #7f8c8d;
        }
        
        .speed-control select {
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--secondary);
            cursor: pointer;
        }
        
        /* Japanese Text Styling */
        .japanese-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.3rem;
            line-height: 2.2;
            margin: 1.5rem 0;
            padding: 1.5rem;
            background: #fafafa;
            border-radius: 15px;
            border: 2px solid #ecf0f1;
        }
        
        .phrase {
            display: inline;
            padding: 0.1rem 0.2rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .phrase:hover {
            background: rgba(231, 76, 60, 0.1);
        }
        
        .phrase.highlight {
            background: var(--active-highlight);
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
            font-weight: 500;
        }
        
        .phrase.played {
            background: var(--highlight);
        }
        
        /* Furigana */
        ruby {
            ruby-align: center;
        }
        
        rt {
            font-size: 0.6em;
            color: #7f8c8d;
        }
        
        /* Translation */
        .translation {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #e8f4f8 0%, #f0f9ff 100%);
            border-radius: 15px;
            border-left: 4px solid #3498db;
        }
        
        .translation h3 {
            color: #2980b9;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .translation p {
            color: #2c3e50;
            line-height: 1.8;
        }
        
        /* Vocabulary Section */
        .vocab-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px dashed #ecf0f1;
        }
        
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .vocab-item {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            border: 2px solid #ecf0f1;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .vocab-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .vocab-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.2rem;
            color: var(--secondary);
            font-weight: 500;
        }
        
        .vocab-reading {
            color: #7f8c8d;
            font-size: 0.85rem;
            margin: 0.2rem 0;
        }
        
        .vocab-meaning {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        /* Loading State */
        .loading-container {
            text-align: center;
            padding: 3rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.1);
            z-index: 1001;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }
        
        /* Scroll to top button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.3s ease;
            opacity: 0;
            visibility: hidden;
            z-index: 998;
        }
        
        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .scroll-top:hover {
            transform: translateY(-5px);
            background: #c0392b;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            color: #7f8c8d;
            margin-top: 2rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.4rem;
            }
            
            .nav-dots {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
                margin-top: 80px;
            }
            
            .reading-card {
                padding: 1.5rem;
            }
            
            .japanese-text {
                font-size: 1.1rem;
                padding: 1rem;
            }
            
            .text-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <header>
        <h1>🎌 JLPT N5 読解 (10 Teks)</h1>
        <p>Pembelajaran Pemahaman Bacaan dengan Audio Interaktif</p>
    </header>

    <!-- Navigation Dots -->
    <div class="nav-dots" id="navDots"></div>

    <div class="main-content" id="content">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Memuat teks...</p>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" onclick="scrollToTop()">↑</button>

    <footer>
        <p>© 2026 JLPT N5 Dokkai Learning | Scroll ke bawah untuk melihat teks berikutnya</p>
    </footer>

    <script>
        let textsData = [];
        let currentAudio = null;
        let isPlaying = false;
        let currentPhraseIndex = 0;
        let currentTextId = null;
        let speechRate = 1;

        // Load XML data
        async function loadXMLData() {
            try {
                const response = await fetch('texts.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const texts = xmlDoc.getElementsByTagName('text');
                textsData = Array.from(texts).map(text => {
                    const phrases = Array.from(text.getElementsByTagName('phrase')).map(phrase => ({
                        jp: phrase.getElementsByTagName('jp')[0].textContent,
                        reading: phrase.getElementsByTagName('reading')[0].textContent
                    }));
                    
                    const vocabItems = Array.from(text.getElementsByTagName('item')).map(item => ({
                        kanji: item.getElementsByTagName('kanji')[0].textContent,
                        reading: item.getElementsByTagName('reading')[0].textContent,
                        romaji: item.getElementsByTagName('romaji')[0].textContent,
                        meaning: item.getElementsByTagName('meaning')[0].textContent
                    }));
                    
                    return {
                        id: text.getAttribute('id'),
                        title: {
                            jp: text.getElementsByTagName('jp')[0].textContent,
                            reading: text.getElementsByTagName('reading')[0].textContent,
                            id: text.getElementsByTagName('id')[0].textContent
                        },
                        phrases: phrases,
                        translation: text.getElementsByTagName('translation')[0].textContent,
                        vocabulary: vocabItems
                    };
                });
                
                renderContent();
                createNavDots();
            } catch (error) {
                console.error('Error loading XML:', error);
                document.getElementById('content').innerHTML = 
                    '<div class="loading-container"><p>Gagal memuat data. Pastikan file texts.xml ada di folder yang sama.</p></div>';
            }
        }

        // Render content
        function renderContent() {
            const container = document.getElementById('content');
            container.innerHTML = textsData.map((text, index) => `
                <div class="reading-card" id="text-${text.id}" data-index="${index}">
                    <div class="text-header">
                        <h2 class="text-title">
                            <span class="text-number">${text.id}</span>
                            ${text.title.jp}（${text.title.reading}）
                        </h2>
                        <div class="audio-controls">
                            <div class="speed-control">
                                <label>Kecepatan:</label>
                                <select id="speed-${text.id}" onchange="changeSpeed(${text.id})">
                                    <option value="0.7">0.7x</option>
                                    <option value="1" selected>1x</option>
                                    <option value="1.2">1.2x</option>
                                </select>
                            </div>
                            <button class="btn-play" id="play-${text.id}" onclick="toggleAudio(${text.id})">
                                <span id="icon-${text.id}">▶</span>
                                <span id="text-btn-${text.id}">Dengarkan</span>
                            </button>
                        </div>
                    </div>

                    <div class="japanese-text" id="text-content-${text.id}">
                        ${text.phrases.map((phrase, pIndex) => `
                            <span class="phrase" data-index="${pIndex}" onclick="speakSinglePhrase(${text.id}, ${pIndex})">
                                <ruby>${phrase.jp}<rt>${phrase.reading}</rt></ruby>
                            </span>
                        `).join('')}
                    </div>

                    <div class="translation">
                        <h3>📝 Terjemahan</h3>
                        <p>${text.translation}</p>
                    </div>

                    <div class="vocab-section">
                        <h3>📚 Kosakata Penting</h3>
                        <div class="vocab-grid">
                            ${text.vocabulary.map(vocab => `
                                <div class="vocab-item" onclick="speakWord('${vocab.reading}')">
                                    <div class="vocab-jp">${vocab.kanji}</div>
                                    <div class="vocab-reading">${vocab.reading} (${vocab.romaji})</div>
                                    <div class="vocab-meaning">${vocab.meaning}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Create navigation dots
        function createNavDots() {
            const dotsContainer = document.getElementById('navDots');
            dotsContainer.innerHTML = textsData.map((_, index) => `
                <div class="nav-dot ${index === 0 ? 'active' : ''}" 
                     onclick="scrollToText(${index})" 
                     data-index="${index}"></div>
            `).join('');
        }

        // Scroll to specific text
        function scrollToText(index) {
            const element = document.getElementById(`text-${textsData[index].id}`);
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Scroll to top
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Change speech speed
        function changeSpeed(textId) {
            const select = document.getElementById(`speed-${textId}`);
            speechRate = parseFloat(select.value);
        }

        // Toggle audio playback
        function toggleAudio(textId) {
            if (isPlaying && currentTextId === textId) {
                stopAudio();
            } else {
                playAudio(textId);
            }
        }

        // Play audio with highlighting
        function playAudio(textId) {
            if (!window.speechSynthesis) {
                alert('Browser Anda tidak mendukung fitur audio. Silakan gunakan Chrome atau Safari.');
                return;
            }

            stopAudio();
            currentTextId = textId;
            isPlaying = true;
            currentPhraseIndex = 0;
            
            const text = textsData.find(t => t.id == textId);
            
            // Update UI
            const btn = document.getElementById(`play-${textId}`);
            const icon = document.getElementById(`icon-${textId}`);
            const textBtn = document.getElementById(`text-btn-${textId}`);
            
            btn.classList.add('playing');
            icon.textContent = '⏸';
            textBtn.textContent = 'Berhenti';
            
            // Clear previous highlights
            document.querySelectorAll(`#text-content-${textId} .phrase`).forEach(p => {
                p.classList.remove('highlight', 'played');
            });
            
            speakNextPhrase(textId, text);
        }

        // Speak next phrase
        function speakNextPhrase(textId, text) {
            if (!isPlaying || currentTextId !== textId) return;
            
            if (currentPhraseIndex >= text.phrases.length) {
                setTimeout(() => stopAudio(), 1000);
                return;
            }
            
            const phrase = text.phrases[currentPhraseIndex];
            const utterance = new SpeechSynthesisUtterance(phrase.reading);
            
            utterance.lang = 'ja-JP';
            utterance.rate = speechRate;
            utterance.pitch = 1;
            
            // Highlight current phrase
            const phraseElements = document.querySelectorAll(`#text-content-${textId} .phrase`);
            if (phraseElements[currentPhraseIndex]) {
                phraseElements[currentPhraseIndex].classList.add('highlight');
                phraseElements[currentPhraseIndex].scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
            }
            
            utterance.onend = () => {
                if (phraseElements[currentPhraseIndex]) {
                    phraseElements[currentPhraseIndex].classList.remove('highlight');
                    phraseElements[currentPhraseIndex].classList.add('played');
                }
                currentPhraseIndex++;
                speakNextPhrase(textId, text);
            };
            
            utterance.onerror = () => {
                stopAudio();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // Speak single phrase
        function speakSinglePhrase(textId, phraseIndex) {
            if (!window.speechSynthesis) return;
            
            const text = textsData.find(t => t.id == textId);
            const phrase = text.phrases[phraseIndex];
            
            const utterance = new SpeechSynthesisUtterance(phrase.reading);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
            
            // Visual feedback
            const element = document.querySelector(`#text-content-${textId} .phrase[data-index="${phraseIndex}"]`);
            element.style.transform = 'scale(1.1)';
            setTimeout(() => {
                element.style.transform = '';
            }, 200);
        }

        // Stop audio
        function stopAudio() {
            window.speechSynthesis.cancel();
            isPlaying = false;
            currentTextId = null;
            
            // Update all buttons
            textsData.forEach(text => {
                const btn = document.getElementById(`play-${text.id}`);
                const icon = document.getElementById(`icon-${text.id}`);
                const textBtn = document.getElementById(`text-btn-${text.id}`);
                
                if (btn) {
                    btn.classList.remove('playing');
                    icon.textContent = '▶';
                    textBtn.textContent = 'Dengarkan';
                }
                
                // Clear highlights
                document.querySelectorAll(`#text-content-${text.id} .phrase`).forEach(p => {
                    p.classList.remove('highlight');
                });
            });
        }

        // Speak individual word
        function speakWord(reading) {
            if (!window.speechSynthesis) return;
            
            const utterance = new SpeechSynthesisUtterance(reading);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        // Scroll spy for navigation dots
        function updateActiveDot() {
            const cards = document.querySelectorAll('.reading-card');
            const scrollPosition = window.scrollY + 150;
            
            cards.forEach((card, index) => {
                const top = card.offsetTop;
                const bottom = top + card.offsetHeight;
                
                if (scrollPosition >= top && scrollPosition < bottom) {
                    document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                        dot.classList.toggle('active', i === index);
                    });
                    
                    // Update progress bar
                    const progress = ((index + 1) / textsData.length) * 100;
                    document.getElementById('progressBar').style.width = progress + '%';
                }
            });
            
            // Show/hide scroll to top button
            const scrollTop = document.getElementById('scrollTop');
            if (window.scrollY > 500) {
                scrollTop.classList.add('visible');
            } else {
                scrollTop.classList.remove('visible');
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', loadXMLData);
        window.addEventListener('scroll', updateActiveDot);
        
        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isPlaying) {
                stopAudio();
            }
        });
    </script>
</body>
</html>
