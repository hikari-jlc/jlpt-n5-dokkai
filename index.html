<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N5 Dokkai - Animasi Scroll</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Indonesian:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #e74c3c;
            --secondary: #2c3e50;
            --accent: #f39c12;
            --bg: #f5f5f0;
            --card: #ffffff;
            --text: #2c3e50;
            --highlight: #fff3cd;
            --active-highlight: #ffeb3b;
        }
        
        body {
            font-family: 'Noto Sans Indonesian', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header dengan gradient animasi */
        header {
            background: linear-gradient(-45deg, #2c3e50, #34495e, #e74c3c, #c0392b);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            color: white;
            padding: 2rem;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.2);
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s ease;
        }
        
        header p {
            font-size: 1rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.3s both;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Main Content */
        .main-content {
            margin-top: 130px;
            padding: 2rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Reading Card dengan animasi scroll */
        .reading-card {
            background: var(--card);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 4rem;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(60px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .reading-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        
        .reading-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--primary));
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* Penomoran yang Menarik */
        .number-badge {
            position: absolute;
            top: -20px;
            left: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary) 0%, #c0392b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
            animation: float 3s ease-in-out infinite;
            z-index: 10;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .number-badge::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            animation: pulseRing 2s infinite;
        }
        
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        /* Decorative elements */
        .reading-card::after {
            content: '❖';
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: rgba(231, 76, 60, 0.1);
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .text-header {
            margin-top: 1rem;
            margin-bottom: 2rem;
            padding-left: 80px;
        }
        
        .text-title {
            font-size: 1.8rem;
            color: var(--secondary);
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .title-jp {
            font-weight: 700;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .title-reading {
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: 500;
        }
        
        /* Audio Controls dengan animasi */
        .audio-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .btn-play {
            background: linear-gradient(135deg, var(--primary) 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-play::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-play:hover::before {
            left: 100%;
        }
        
        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }
        
        .btn-play:active {
            transform: translateY(-1px);
        }
        
        .btn-play.playing {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            animation: pulseGreen 1.5s infinite;
        }
        
        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(39, 174, 96, 0); }
        }
        
        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #ecf0f1 0%, #f8f9fa 100%);
            padding: 0.8rem 1.2rem;
            border-radius: 25px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .speed-control:hover {
            border-color: var(--primary);
        }
        
        .speed-control select {
            border: none;
            background: transparent;
            font-weight: 700;
            color: var(--secondary);
            cursor: pointer;
            font-size: 1rem;
        }
        
        /* Japanese Text dengan animasi stagger */
        .japanese-text {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.5rem;
            line-height: 2.8;
            margin: 2rem 0;
            padding: 2rem;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
            border-radius: 20px;
            border: 3px solid #ecf0f1;
            position: relative;
        }
        
        .phrase {
            display: inline;
            margin-right: 0.4rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInPhrase 0.5s ease forwards;
        }
        
        @keyframes fadeInPhrase {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Styling untuk ruby */
        ruby {
            ruby-align: center;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: bottom;
            line-height: 1;
            margin: 0 1px;
        }
        
        rb {
            font-size: 1.5rem;
            line-height: 1.2;
            font-weight: 500;
        }
        
        rt {
            font-size: 0.6rem;
            color: #e74c3c;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 2px;
        }
        
        .phrase-content {
            padding: 0.3rem 0.4rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }
        
        .phrase-content:hover {
            background: rgba(231, 76, 60, 0.15);
            transform: scale(1.05);
        }
        
        .phrase-content.highlight {
            background: var(--active-highlight);
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.6);
            animation: highlightPulse 0.5s ease;
        }
        
        @keyframes highlightPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .phrase-content.played {
            background: var(--highlight);
        }
        
        /* Translation dengan animasi */
        .translation {
            margin-top: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #e8f4f8 0%, #d4edda 100%);
            border-radius: 20px;
            border-left: 5px solid #3498db;
            position: relative;
            opacity: 0;
            transform: translateX(-30px);
            transition: all 0.6s ease 0.3s;
        }
        
        .reading-card.visible .translation {
            opacity: 1;
            transform: translateX(0);
        }
        
        .translation::before {
            content: '💬';
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 1.5rem;
            background: white;
            padding: 0.5rem;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .translation h3 {
            color: #2980b9;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-left: 3rem;
        }
        
        .translation p {
            color: #2c3e50;
            line-height: 1.9;
            font-size: 1.05rem;
        }
        
        /* Vocabulary Section dengan animasi */
        .vocab-section {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 3px dashed #ecf0f1;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease 0.5s;
        }
        
        .reading-card.visible .vocab-section {
            opacity: 1;
            transform: translateY(0);
        }
        
        .vocab-section h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--secondary);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
        }
        
        .vocab-item {
            background: white;
            padding: 1.2rem;
            border-radius: 15px;
            border: 2px solid #ecf0f1;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .vocab-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }
        
        .vocab-item:hover {
            border-color: var(--primary);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        
        .vocab-item:hover::before {
            transform: scaleY(1);
        }
        
        .vocab-jp {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.4rem;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        
        .vocab-reading {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .vocab-meaning {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
            background: rgba(231, 76, 60, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
        }
        
        /* Loading State */
        .loading-container {
            text-align: center;
            padding: 5rem;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Scroll Progress Indicator */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            z-index: 1001;
            transition: width 0.1s;
        }
        
        /* Floating Navigation */
        .floating-nav {
            position: fixed;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
            background: rgba(255,255,255,0.95);
            padding: 20px 12px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        
        .nav-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #bdc3c7;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid transparent;
            position: relative;
        }
        
        .nav-dot:hover {
            background: var(--primary);
            transform: scale(1.4);
        }
        
        .nav-dot.active {
            background: var(--primary);
            border-color: white;
            box-shadow: 0 0 0 3px var(--primary);
            transform: scale(1.3);
        }
        
        .nav-dot::after {
            content: attr(data-number);
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--secondary);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .nav-dot:hover::after {
            opacity: 1;
            visibility: visible;
            right: 30px;
        }
        
        /* Scroll to Top Button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, #c0392b 100%);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.8);
            z-index: 998;
        }
        
        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        
        .scroll-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 15px 35px rgba(231, 76, 60, 0.5);
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 4rem 2rem;
            color: #7f8c8d;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            margin-top: 3rem;
            position: relative;
        }
        
        footer::before {
            content: '⛩️';
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 1.5rem; }
            header h1 { font-size: 1.5rem; }
            
            .floating-nav { display: none; }
            
            .main-content {
                padding: 1rem;
                margin-top: 100px;
            }
            
            .reading-card {
                padding: 1.8rem;
                margin-bottom: 3rem;
            }
            
            .number-badge {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
                top: -15px;
                left: 20px;
            }
            
            .text-header {
                padding-left: 60px;
                margin-top: 0.5rem;
            }
            
            .text-title { font-size: 1.4rem; }
            
            .japanese-text {
                font-size: 1.2rem;
                padding: 1.2rem;
                line-height: 2.5;
            }
            
            rb { font-size: 1.2rem; }
            rt { font-size: 0.5rem; }
            
            .audio-controls {
                flex-direction: column;
                width: 100%;
            }
            
            .btn-play { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header>
        <h1>🎌 JLPT N5 読解</h1>
        <p>Pembelajaran Pemahaman Bacaan dengan Audio & Animasi</p>
    </header>

    <!-- Floating Navigation -->
    <div class="floating-nav" id="floatingNav"></div>

    <div class="main-content" id="content">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Memuat teks...</p>
        </div>
    </div>

    <button class="scroll-top" id="scrollTop" onclick="scrollToTop()">↑</button>

    <footer>
        <p>© 2026 JLPT N5 Dokkai Learning | Scroll untuk melihat animasi</p>
    </footer>

    <script>
        let textsData = [];
        let isPlaying = false;
        let currentTextId = null;
        let currentPhraseIndex = 0;
        let speechRate = 1;
        let observer;

        // Parse phrase content
        function parsePhraseContent(phraseElement) {
            let html = '';
            let readingText = '';
            
            const nodes = phraseElement.childNodes;
            
            for (let node of nodes) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent.trim();
                    if (text) {
                        html += `<span class="okurigana">${text}</span>`;
                        readingText += text;
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'segment') {
                    const kanji = node.getElementsByTagName('kanji')[0]?.textContent || '';
                    const furigana = node.getElementsByTagName('furigana')[0]?.textContent || '';
                    
                    html += `<ruby><rb>${kanji}</rb><rt>${furigana}</rt></ruby>`;
                    readingText += furigana;
                }
            }
            
            return { html, reading: readingText };
        }

        // Load XML data
        async function loadXMLData() {
            try {
                const response = await fetch('texts.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const texts = xmlDoc.getElementsByTagName('text');
                textsData = Array.from(texts).map(text => {
                    const phraseElements = Array.from(text.getElementsByTagName('phrase'));
                    const phrases = phraseElements.map(phraseEl => {
                        const parsed = parsePhraseContent(phraseEl);
                        return {
                            html: parsed.html,
                            reading: parsed.reading
                        };
                    });
                    
                    const vocabItems = Array.from(text.getElementsByTagName('item')).map(item => ({
                        word: item.getElementsByTagName('word')[0]?.textContent || '',
                        reading: item.getElementsByTagName('reading')[0]?.textContent || '',
                        romaji: item.getElementsByTagName('romaji')[0]?.textContent || '',
                        meaning: item.getElementsByTagName('meaning')[0]?.textContent || ''
                    }));
                    
                    return {
                        id: text.getAttribute('id'),
                        title: {
                            jp: text.getElementsByTagName('jp')[0]?.textContent || '',
                            reading: text.getElementsByTagName('reading')[0]?.textContent || '',
                            id: text.getElementsByTagName('id')[0]?.textContent || ''
                        },
                        phrases: phrases,
                        translation: text.getElementsByTagName('translation')[0]?.textContent || '',
                        vocabulary: vocabItems
                    };
                });
                
                renderContent();
                createFloatingNav();
                setupIntersectionObserver();
                setupScrollListener();
            } catch (error) {
                console.error('Error loading XML:', error);
                document.getElementById('content').innerHTML = 
                    '<div class="loading-container"><p>Gagal memuat data. Pastikan file texts.xml ada di folder yang sama.</p></div>';
            }
        }

        // Render content dengan stagger animation untuk phrases
        function renderContent() {
            const container = document.getElementById('content');
            container.innerHTML = textsData.map((text, index) => `
                <div class="reading-card" id="text-${text.id}" data-index="${index}">
                    <div class="number-badge">${text.id}</div>
                    
                    <div class="text-header">
                        <h2 class="text-title">
                            <span class="title-jp">${text.title.jp}</span>
                            <span class="title-reading">(${text.title.reading}) — ${text.title.id}</span>
                        </h2>
                        <div class="audio-controls">
                            <div class="speed-control">
                                <label>⚡</label>
                                <select id="speed-${text.id}" onchange="changeSpeed(${text.id})">
                                    <option value="0.7">0.7x</option>
                                    <option value="1" selected>1x</option>
                                    <option value="1.2">1.2x</option>
                                </select>
                            </div>
                            <button class="btn-play" id="play-${text.id}" onclick="toggleAudio(${text.id})">
                                <span id="icon-${text.id}">▶</span>
                                <span id="text-btn-${text.id}">Dengarkan</span>
                            </button>
                        </div>
                    </div>

                    <div class="japanese-text" id="text-content-${text.id}">
                        ${text.phrases.map((phrase, pIndex) => `
                            <span class="phrase" style="animation-delay: ${pIndex * 0.1}s" data-index="${pIndex}">
                                <span class="phrase-content" onclick="speakSinglePhrase(${text.id}, ${pIndex})">
                                    ${phrase.html}
                                </span>
                            </span>
                        `).join('')}
                    </div>

                    <div class="translation">
                        <h3>Terjemahan</h3>
                        <p>${text.translation}</p>
                    </div>

                    <div class="vocab-section">
                        <h3>📚 Kosakata Penting</h3>
                        <div class="vocab-grid">
                            ${text.vocabulary.map((vocab, vIndex) => `
                                <div class="vocab-item" style="animation-delay: ${vIndex * 0.1}s" onclick="speakWord('${vocab.reading}')">
                                    <div class="vocab-jp">${vocab.word}</div>
                                    <div class="vocab-reading">${vocab.reading} (${vocab.romaji})</div>
                                    <div class="vocab-meaning">${vocab.meaning}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Create floating navigation
        function createFloatingNav() {
            const nav = document.getElementById('floatingNav');
            nav.innerHTML = textsData.map((text, index) => `
                <div class="nav-dot" 
                     data-number="${text.title.jp}" 
                     onclick="scrollToText(${index})" 
                     data-index="${index}"></div>
            `).join('');
        }

        // Setup Intersection Observer untuk animasi scroll
        function setupIntersectionObserver() {
            const options = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        
                        // Update active nav dot
                        const index = entry.target.dataset.index;
                        document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                            dot.classList.toggle('active', i == index);
                        });
                    }
                });
            }, options);

            // Observe all reading cards
            document.querySelectorAll('.reading-card').forEach(card => {
                observer.observe(card);
            });
        }

        // Setup scroll listener untuk progress bar dan scroll-to-top
        function setupScrollListener() {
            window.addEventListener('scroll', () => {
                // Update scroll progress bar
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                document.getElementById('scrollProgress').style.width = scrolled + '%';
                
                // Show/hide scroll to top button
                const scrollTop = document.getElementById('scrollTop');
                if (winScroll > 500) {
                    scrollTop.classList.add('visible');
                } else {
                    scrollTop.classList.remove('visible');
                }
            });
        }

        // Scroll to specific text
        function scrollToText(index) {
            const element = document.getElementById(`text-${textsData[index].id}`);
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Scroll to top
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Change speech speed
        function changeSpeed(textId) {
            const select = document.getElementById(`speed-${textId}`);
            speechRate = parseFloat(select.value);
        }

        // Toggle audio playback
        function toggleAudio(textId) {
            if (isPlaying && currentTextId === textId) {
                stopAudio();
            } else {
                playAudio(textId);
            }
        }

        // Play audio dengan highlighting
        function playAudio(textId) {
            if (!window.speechSynthesis) {
                alert('Browser Anda tidak mendukung fitur audio.');
                return;
            }

            stopAudio();
            currentTextId = textId;
            isPlaying = true;
            currentPhraseIndex = 0;
            
            const text = textsData.find(t => t.id == textId);
            
            // Update UI
            const btn = document.getElementById(`play-${textId}`);
            const icon = document.getElementById(`icon-${textId}`);
            const textBtn = document.getElementById(`text-btn-${textId}`);
            
            btn.classList.add('playing');
            icon.textContent = '⏸';
            textBtn.textContent = 'Berhenti';
            
            // Clear previous highlights
            document.querySelectorAll(`#text-content-${textId} .phrase-content`).forEach(p => {
                p.classList.remove('highlight', 'played');
            });
            
            speakNextPhrase(textId, text);
        }

        // Speak next phrase
        function speakNextPhrase(textId, text) {
            if (!isPlaying || currentTextId !== textId) return;
            
            if (currentPhraseIndex >= text.phrases.length) {
                setTimeout(() => stopAudio(), 1000);
                return;
            }
            
            const phrase = text.phrases[currentPhraseIndex];
            const utterance = new SpeechSynthesisUtterance(phrase.reading);
            
            utterance.lang = 'ja-JP';
            utterance.rate = speechRate;
            utterance.pitch = 1;
            
            // Highlight current phrase
            const phraseElements = document.querySelectorAll(`#text-content-${textId} .phrase-content`);
            if (phraseElements[currentPhraseIndex]) {
                phraseElements[currentPhraseIndex].classList.add('highlight');
                phraseElements[currentPhraseIndex].scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center' 
                });
            }
            
            utterance.onend = () => {
                if (phraseElements[currentPhraseIndex]) {
                    phraseElements[currentPhraseIndex].classList.remove('highlight');
                    phraseElements[currentPhraseIndex].classList.add('played');
                }
                currentPhraseIndex++;
                speakNextPhrase(textId, text);
            };
            
            utterance.onerror = () => {
                stopAudio();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        // Speak single phrase
        function speakSinglePhrase(textId, phraseIndex) {
            if (!window.speechSynthesis) return;
            
            const text = textsData.find(t => t.id == textId);
            const phrase = text.phrases[phraseIndex];
            
            const utterance = new SpeechSynthesisUtterance(phrase.reading);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
            
            // Visual feedback dengan animasi
            const element = document.querySelector(`#text-content-${textId} .phrase[data-index="${phraseIndex}"] .phrase-content`);
            element.style.transform = 'scale(1.1)';
            element.style.background = 'rgba(231, 76, 60, 0.2)';
            setTimeout(() => {
                element.style.transform = '';
                element.style.background = '';
            }, 300);
        }

        // Stop audio
        function stopAudio() {
            window.speechSynthesis.cancel();
            isPlaying = false;
            currentTextId = null;
            
            textsData.forEach(text => {
                const btn = document.getElementById(`play-${text.id}`);
                const icon = document.getElementById(`icon-${text.id}`);
                const textBtn = document.getElementById(`text-btn-${text.id}`);
                
                if (btn) {
                    btn.classList.remove('playing');
                    icon.textContent = '▶';
                    textBtn.textContent = 'Dengarkan';
                }
                
                document.querySelectorAll(`#text-content-${text.id} .phrase-content`).forEach(p => {
                    p.classList.remove('highlight');
                });
            });
        }

        // Speak individual word
        function speakWord(reading) {
            if (!window.speechSynthesis) return;
            
            const utterance = new SpeechSynthesisUtterance(reading);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadXMLData);
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isPlaying) {
                stopAudio();
            }
        });
    </script>
</body>
</html>
